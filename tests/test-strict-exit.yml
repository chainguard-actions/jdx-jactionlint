name: Test strict-exit mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a workflow file with a known lint warning
        run: |
          mkdir -p /tmp/test-workflows
          # Create a workflow with an unpinned action (a common warning-level finding)
          cat > /tmp/test-workflows/bad-workflow.yml << 'EOF'
          name: Bad workflow
          on: push
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
          EOF
      - id: action-strict
        uses: .
        with:
          strict-exit: "true"
          online: "false"
          annotations: "false"
          color: "false"
          files: /tmp/test-workflows/bad-workflow.yml
        continue-on-error: true
      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action-strict.outcome }}
          EXECUTABLE: ${{ steps.action-strict.outputs.executable }}
        run: |
          echo "outcome: $OUTCOME"
          echo "executable: $EXECUTABLE"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          if [ -z "$EXECUTABLE" ]; then
            echo "FAIL: executable output is empty"
            exit 1
          fi
          echo "PASS: action ran with outcome '$OUTCOME' and executable '$EXECUTABLE'"
