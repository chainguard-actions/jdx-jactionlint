name: Test errors in a workflow fail the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/workflows/broken.yml
          online: "false"
          annotations: "false"
          color: "false"
      - name: Assert the action failed on findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a workflow with errors"
            exit 1
          fi
          echo "PASS"
