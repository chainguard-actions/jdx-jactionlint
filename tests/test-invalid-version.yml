name: Test invalid version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "v2.x"
          online: "false"
      - name: Assert the step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXE: ${{ steps.action.outputs.executable }}
        run: |
          echo "outcome: $OUTCOME"
          echo "executable: $EXE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for an invalid version"
            exit 1
          fi
          if [ -n "$EXE" ]; then
            echo "FAIL: no executable should be reported"
            exit 1
          fi
          echo "PASS"
