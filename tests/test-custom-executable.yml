name: Test custom executable input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install jactionlint manually
        id: install
        run: |
          dir="${RUNNER_TEMP}/jactionlint-manual"
          mkdir -p "$dir"
          bash "$GITHUB_WORKSPACE/scripts/download-jactionlint.bash" "2.2.0" "$dir"
          echo "executable=${dir}/jactionlint" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          executable: ${{ steps.install.outputs.executable }}
          online: "false"
          annotations: "false"
          color: "false"
          files: tests/test-custom-executable.yml
        continue-on-error: true
      - name: Assert executable output matches provided executable
        env:
          EXPECTED: ${{ steps.install.outputs.executable }}
          ACTUAL: ${{ steps.action.outputs.executable }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "expected executable: $EXPECTED"
          echo "actual executable: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected executable '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: executable output matches provided executable"
      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with outcome '$OUTCOME'"
