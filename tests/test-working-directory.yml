name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          working-directory: tests/fixtures/workflows
          files: clean.yml
          online: "false"
          min-severity: error
          profile: correctness
      - name: Assert action succeeded with executable output
        env:
          ACTUAL: ${{ steps.action.outputs.executable }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "executable: $ACTUAL"
          if [ "$OUTCOME" != "success" ] || [ -z "$ACTUAL" ]; then
            echo "FAIL"
            exit 1
          fi
          echo "PASS"
